version: '3'
services:
  backend:
    build: ./backend
    ports:
    - "8080:8080"
    depends_on:
    - db
    environment:
    - DATABASE_HOST=db
    - DATABASE_USER=root
    - DATABASE_PASSWORD=password
    - DATABASE_NAME=taskmaster
    restart: always

  frontend:
    build: ./frontend
    ports:
    - "3000:3000"
    depends_on:
    - backend
    restart: always

  db:
    image: mysql:8.0
    environment:
    - MYSQL_ROOT_PASSWORD=password
    - MYSQL_DATABASE=taskmaster
    - MYSQL_USER=root
    - MYSQL_PASSWORD=password
    volumes:
    - ./database/data.sql:/docker-entrypoint-initdb.d/data.sql
    restart: always

  nginx:
    image: nginx:latest
    ports:
    - "80:80"
    depends_on:
    - frontend
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

networks:
  default:
    driver: bridge