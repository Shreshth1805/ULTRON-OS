version: '3.9'
services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/database
      - SQLALCHEMY_DATABASE_URL=postgresql://user:password@db:5432/database
    restart: always

  db:
    image: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=database
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

  alembic:
    build: .
    command: alembic upgrade head
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/database
      - SQLALCHEMY_DATABASE_URL=postgresql://user:password@db:5432/database

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      device: /var/lib/docker/volumes/todo-api_db-data
      o: bind

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
          ip_range: 10.10.10.128/25
          aux_addresses:
            static:
              - "10.10.10.2=web"
              - "10.10.10.3=db"